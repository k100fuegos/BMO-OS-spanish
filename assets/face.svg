<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <!-- Ojos -->
    <g id="eyes">
        <circle id="left-eye" cx="250" cy="250" r="25" fill="#2c4c3b"/>
        <circle id="right-eye" cx="550" cy="250" r="25" fill="#2c4c3b"/>
    </g>
    
    <!-- Mejillas (opcionales, a veces BMO no las muestra pero le dan vida) -->
    <g id="cheeks" opacity="0">
        <circle cx="180" cy="300" r="30" fill="#ffb6c1" opacity="0.6"/>
        <circle cx="620" cy="300" r="30" fill="#ffb6c1" opacity="0.6"/>
    </g>

    <!-- Boca -->
    <g id="mouth-group">
        <!-- Default smile (curva) -->
        <path id="mouth" d="M 350 320 Q 400 360 450 320" stroke="#2c4c3b" stroke-width="12" stroke-linecap="round" fill="none"/>
    </g>
</svg>
